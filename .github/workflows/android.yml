name: Build Nova APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick newest NovaAI zip
        run: |
          ZIP=$(ls NovaAI-v*.zip 2>/dev/null | sort -V | tail -n1)
          if [ -z "$ZIP" ]; then echo "No NovaAI-v*.zip found in repo root"; exit 1; fi
          echo "Using $ZIP"
          rm -rf build_src && mkdir build_src
          unzip -q "$ZIP" -d build_src
          SETTINGS=$(find build_src -name settings.gradle.kts | head -n1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found inside $ZIP"; exit 1; fi
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP%.zip}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
